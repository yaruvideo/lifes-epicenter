name: Publish app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The preview copy: whatever is on the `preview` branch, served at /preview/.
      # (After pushing `preview`, run this workflow on main to republish: gh workflow run deploy.yml --ref main)
      - uses: actions/checkout@v4
        with:
          ref: preview
          path: pv
        continue-on-error: true
      - name: Build preview
        if: hashFiles('pv/package.json') != ''
        working-directory: pv
        run: npm ci && VITE_PREVIEW=1 npm run build && cp -r dist ../dist/preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
